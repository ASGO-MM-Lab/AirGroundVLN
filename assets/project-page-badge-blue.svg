<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="108" height="20" role="img" aria-label="Project Page">
  <title>Project Page</title>
  <defs>
    <linearGradient id="g" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".10"/>
    </linearGradient>
    <clipPath id="badge"><rect width="108" height="20" rx="3"/></clipPath>
    <clipPath id="logo"><rect x="3" y="1" width="18" height="18" rx="2"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="24" height="20" fill="#555"/>
    <rect x="24" width="84" height="20" fill="#146DC2"/>
    <rect width="108" height="20" fill="url(#g)"/>
  </g>
  <image x="3" y="1" width="18" height="18" clip-path="url(#logo)" xlink:href="data:image/png;base64,"/>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="66" y="15" fill="#010101" fill-opacity=".3">Project Page</text>
    <text x="66" y="14">Project Page</text>
  </g>
</svg>
